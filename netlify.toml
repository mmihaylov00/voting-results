[build]
command = "npm run build"
publish = "dist/votes-frontend/browser"

[functions]
directory = "netlify/functions"
node_bundler = "esbuild"

[functions."facebook-tone-suggestions"]
included_files = ["public/data/facebook/2026/report.json", "public/data/facebook/2026/comments/*.json"]

[[headers]]
  for = "/research/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow, noarchive"

[[headers]]
  for = "/data/facebook/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow, noarchive"

[[headers]]
  for = "/images/facebook/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow, noarchive"

[[headers]]
  for = "/data/forensics/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow, noarchive"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
