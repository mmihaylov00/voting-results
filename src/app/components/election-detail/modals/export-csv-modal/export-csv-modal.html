<div class="fixed inset-0 z-[110] flex items-center justify-center bg-background/80 backdrop-blur-sm p-4" (click)="close.emit()">
    <div hlmCard class="w-full max-w-2xl max-h-[90vh] overflow-hidden flex flex-col shadow-2xl border-primary/20 bg-background/50 backdrop-blur-md" (click)="$event.stopPropagation()">
        <div class="flex justify-between items-center p-6 border-b border-primary/20">
            <div>
                <h3 hlmH4 class="m-0 text-secondary dark:text-primary">Експорт на данни</h3>
                <p hlmMuted class="text-xs">Изберете партии за включване в CSV файла</p>
            </div>
            <button hlmBtn variant="ghost" size="icon" (click)="close.emit()" class="text-secondary dark:text-primary hover:bg-primary dark:hover:bg-primary dark:hover:text-primary-foreground">
                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
            </button>
        </div>

        <div class="overflow-auto p-6 flex-grow space-y-6">
            <div class="space-y-4 border-b border-primary/10 pb-6">
              <h4 hlmH4 class="mb-2 text-sm font-semibold uppercase tracking-wider text-secondary/70 dark:text-primary/70">Филтри</h4>
              <div class="flex flex-col gap-4">
                <div class="flex flex-wrap gap-2">
                  <button hlmBtn size="sm" [variant]="'line'" [attr.data-state]="activeTab() === 'all' ? 'active' : 'inactive'" (click)="setTab('all')">Всички</button>
                  <button hlmBtn size="sm" [variant]="'line'" [attr.data-state]="activeTab() === 'target' ? 'active' : 'inactive'" (click)="setTab('target')">Целеви</button>
                  <button hlmBtn size="sm" [variant]="'line'" [attr.data-state]="activeTab() === 'swing' ? 'active' : 'inactive'" (click)="setTab('swing')">Люлеещи се</button>
                  <button hlmBtn size="sm" [variant]="'line'" [attr.data-state]="activeTab() === 'outside' ? 'active' : 'inactive'" (click)="setTab('outside')">Извън топ 3</button>
                  <button hlmBtn size="sm" [variant]="'line'" [attr.data-state]="activeTab() === 'risky' ? 'active' : 'inactive'" (click)="setTab('risky')">Рискови</button>
                  @if (date !== '2023.04.02') {
                    <button hlmBtn size="sm" [variant]="'line'" [attr.data-state]="activeTab() === 'declining' ? 'active' : 'inactive'" (click)="setTab('declining')">Намаляващи</button>
                  }
                </div>
                <div class="flex flex-col sm:flex-row gap-4">
                  <div class="w-full sm:w-64 flex items-center gap-2">
                    <div class="relative w-full">
                      <button hlmBtn variant="ghost" size="sm" (click)="toggleActivityOperator()"
                              class="absolute left-1 top-1/2 -translate-y-1/2 h-8 px-2 text-xs font-semibold hover:bg-primary/10 text-muted-foreground transition-all">
                        Активност {{ activityOperator() === 'lte' ? '≤' : '≥' }}
                      </button>
                      <input hlmInput type="number" placeholder="0" [(ngModel)]="lowActivityThreshold" (ngModelChange)="applyFilter()" min="0" max="100" step="0.01" class="border-primary/50 focus:border-primary dark:border-secondary/50 dark:focus:border-secondary w-full pr-6 pl-32 text-right" />
                      <span class="absolute right-3 top-1/2 -translate-y-1/2 text-sm text-muted-foreground">%</span>
                    </div>
                  </div>
                  <div class="flex-grow">
                    <input hlmInput placeholder="Търсене..." [(ngModel)]="searchTerm" (ngModelChange)="applyFilter()" class="border-primary/50 focus:border-primary dark:border-secondary/50 dark:focus:border-secondary w-full" />
                  </div>
                </div>
              </div>
            </div>

            <div>
                <h4 hlmH4 class="mb-2 text-sm font-semibold uppercase tracking-wider text-secondary/70 dark:text-primary/70">Колони</h4>
                <div class="grid grid-cols-1 md:grid-cols-2 gap-2">
                    @for (column of availableColumns; track column.id) {
                        <div class="flex items-center gap-2 p-2 hover:bg-muted rounded cursor-pointer" (click)="toggleExportColumnSelection(column.id)">
                            <input type="checkbox" [checked]="exportColumnIds.has(column.id)" class="cursor-pointer" (click)="$event.stopPropagation(); toggleExportColumnSelection(column.id)" />
                            <span class="text-sm truncate">{{ column.label }}</span>
                        </div>
                    }
                </div>
            </div>

            <div>
                <h4 hlmH4 class="mb-2 text-sm font-semibold uppercase tracking-wider text-secondary/70 dark:text-primary/70">Партии</h4>
                <div class="grid grid-cols-1 md:grid-cols-2 gap-2">
                    @for (party of allParties; track party.id) {
                        <div class="flex items-center gap-2 p-2 hover:bg-muted rounded cursor-pointer" (click)="toggleExportPartySelection(party.id)">
                            <input type="checkbox" [checked]="exportPartyIds.has(party.id)" class="cursor-pointer" (click)="$event.stopPropagation(); toggleExportPartySelection(party.id)" />
                            <span class="text-sm truncate">{{ party.name }}</span>
                        </div>
                    }
                </div>
            </div>
        </div>

        <div class="flex justify-end gap-2 p-6 border-t border-primary/20">
            <button hlmBtn variant="outline" (click)="close.emit()">Отказ</button>
            <button hlmBtn variant="default" (click)="downloadCsv()">Експорт {{ filteredSections.length }} записа</button>
        </div>
    </div>
</div>
