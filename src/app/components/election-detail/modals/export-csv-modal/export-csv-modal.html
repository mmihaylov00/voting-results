<app-base-modal #modal
  pageId="export"
  [pageQueryParams]="pageQueryParams"
  [title]="modalTitle"
  [subtitle]="modalSubtitle"
  zIndex="z-[1200]"
  (close)="close.emit()">

  <ng-template #headerActions>
    <div class="flex flex-row justify-start mt-3">
      <app-party-filter
        position="right"
        [parties]="allParties"
        [partyVotes]="partyVotes"
        [selectedPartyIds]="exportPartyIds"
        (selectedPartyIdsChange)="onExportPartySelectionChange($event)"/>
    </div>
  </ng-template>

  <div class="space-y-6">
    <div>
      <div class="mb-2 flex flex-wrap items-center justify-between gap-2">
        <h4 hlmH4 class="text-sm font-semibold uppercase tracking-wider text-secondary/70 dark:text-primary/70">Колони</h4>
        <p class="text-sm text-muted-foreground">{{ exportCount | number }} записа</p>
      </div>
      <div class="grid grid-cols-1 md:grid-cols-2 gap-2">
        @for (column of exportColumns; track column.id) {
          <label class="flex items-center gap-2 p-2 hover:bg-muted rounded cursor-pointer">
            <input type="checkbox" [checked]="isColumnSelected(column.id)" class="cursor-pointer accent-primary"
                   [disabled]="isColumnSelected(column.id) && (viewMode === 'candidates' ? exportCandidateColumnIds.size : exportColumnIds.size) === 1"
                   (change)="toggleExportColumnSelection(column.id)"/>
            <span class="text-sm truncate">{{ column.label }}</span>
          </label>
        }
      </div>
    </div>
  </div>

  <ng-template #footer>
    <button hlmBtn variant="outline" type="button" (click)="modal.closeModal()">Отказ</button>
    <app-csv-export-button [action]="csvExportAction" [disabled]="!exportCount" (exported)="modal.closeModal()" />
  </ng-template>
</app-base-modal>
