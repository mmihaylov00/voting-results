<div class="flex flex-col gap-4 w-full" [class.xl:flex-row]="!fullWidth" [class.xl:w-auto]="!fullWidth" [class.items-start]="fullWidth" [class.lg:items-center]="!fullWidth">
    <div class="flex flex-wrap gap-2 border-b border-primary/10 w-full" [class.xl:w-auto]="!fullWidth">
        <button hlmBtn [variant]="'line'" [attr.data-state]="activeTab() === 'all' ? 'active' : 'inactive'" (click)="setTab('all')" [hlmTooltip]="'Показва всички секции в района'">
            @if (showIcons) {
                <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="mr-2"><rect width="7" height="7" x="3" y="3" rx="1"/><rect width="7" height="7" x="14" y="3" rx="1"/><rect width="7" height="7" x="14" y="14" rx="1"/><rect width="7" height="7" x="3" y="14" rx="1"/></svg>
            }
            Всички
        </button>
        <button hlmBtn [variant]="'line'" [attr.data-state]="activeTab() === 'target' ? 'active' : 'inactive'" (click)="setTab('target')" [hlmTooltip]="'Секции, в които ПП-ДБ е първа политическа сила'">
            @if (showIcons) {
                <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="mr-2"><circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="6"/><circle cx="12" cy="12" r="2"/></svg>
            }
            Целеви
        </button>
        <button hlmBtn [variant]="'line'" [attr.data-state]="activeTab() === 'swing' ? 'active' : 'inactive'" (click)="setTab('swing')" [hlmTooltip]="'Секции, в които ПП-ДБ е на по-малко от 5% разлика от първия'">
            @if (showIcons) {
                <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="mr-2"><path d="m21 21-6-6m6 6v-4.8m0 4.8h-4.8"/><path d="M3 3 9 9M3 3v4.8M3 3h4.8"/></svg>
            }
            Люлеещи се
        </button>
        <button hlmBtn [variant]="'line'" [attr.data-state]="activeTab() === 'outside' ? 'active' : 'inactive'" (click)="setTab('outside')" [hlmTooltip]="'Секции, в които ПП-ДБ е извън челните три места'">
            @if (showIcons) {
                <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="mr-2"><circle cx="12" cy="12" r="10"/><line x1="4.93" y1="4.93" x2="19.07" y2="19.07"/></svg>
            }
            Извън топ 3
        </button>
        <button hlmBtn [variant]="'line'" [attr.data-state]="activeTab() === 'risky' ? 'active' : 'inactive'" (click)="setTab('risky')" [hlmTooltip]="'Секции с висока активност (>50%), в които ПП-ДБ не е първа сила'">
            @if (showIcons) {
                <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="mr-2"><path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3Z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>
            }
            Рискови
        </button>
        @if (date !== '2023.04.02') {
            <button hlmBtn [variant]="'line'" [attr.data-state]="activeTab() === 'declining' ? 'active' : 'inactive'" (click)="setTab('declining')" [hlmTooltip]="'Секции, в които гласовете за ПП-ДБ са по-малко от предходните избори'">
                @if (showIcons) {
                    <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="mr-2"><path d="M12 5v14M5 12l7 7 7-7"/></svg>
                }
                Намаляващи
            </button>
        }
    </div>
    <div class="flex flex-col gap-4 w-full" [class.sm:flex-row]="!fullWidth" [class.xl:w-auto]="!fullWidth">
        <div class="w-full flex items-center gap-2" [class.sm:w-56]="!fullWidth">
            <div class="relative w-full">
                <button hlmBtn variant="ghost" size="sm" (click)="toggleActivityOperator()"
                        class="absolute left-1 top-1/2 -translate-y-1/2 h-8 px-2 text-xs font-semibold hover:bg-primary/10 text-muted-foreground transition-all"
                        [hlmTooltip]="activityOperator() === 'lte' ? 'Превключи към по-голямо или равно' : 'Превключи към по-малко или равно'">
                    Активност {{ activityOperator() === 'lte' ? '≤' : '≥' }}
                </button>
                <input hlmInput type="number" placeholder="0" [ngModel]="lowActivityThreshold()" (ngModelChange)="onThresholdChange($event)" min="0" max="100" step="0.01" class="border-primary/50 focus:border-primary dark:border-secondary/50 dark:focus:border-secondary w-full pr-6 pl-32 text-right" />
                <span class="absolute right-3 top-1/2 -translate-y-1/2 text-sm text-muted-foreground">%</span>
            </div>
        </div>
        <div class="flex-grow flex gap-2" [class.sm:w-64]="!fullWidth">
            <input hlmInput placeholder="Търсене..." [ngModel]="searchTerm()" (ngModelChange)="onSearchTermChange($event)" class="border-primary/50 focus:border-primary dark:border-secondary/50 dark:focus:border-secondary w-full" />
            <ng-content></ng-content>
        </div>
    </div>
</div>
