<div class="flex flex-col gap-3 w-full">
  <div class="grid grid-cols-[repeat(auto-fit,minmax(min(100%,11rem),1fr))] gap-3 w-full">
    <!-- Section Types Dropdown (Multiselect) -->
    <div class="relative w-full">
      <button hlmBtn variant="outline" size="sm" (click)="toggleSectionTypesDropdown($event)"
              class="w-full justify-between h-9 text-sm border-primary/50 text-secondary hover:bg-primary hover:text-secondary dark:border-secondary/50 dark:text-secondary dark:hover:bg-secondary dark:hover:text-secondary-foreground">
        <span class="inline-flex items-center gap-2"><app-map-icon name="section" />{{ getSectionTypesLabel() }}</span>
        <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
             [class.rotate-180]="showSectionTypesDropdown()">
          <path d="m6 9 6 6 6-6"/>
        </svg>
      </button>
      @if (showSectionTypesDropdown()) {
        <div class="absolute z-50 mt-1 w-full overflow-auto bg-popover text-popover-foreground border border-primary/20 rounded-md shadow-md p-2" (click)="$event.stopPropagation()">
          @for (type of availableSectionTypes; track type.id) {
            <div class="flex items-center gap-2 p-2 hover:bg-muted rounded cursor-pointer" (click)="toggleSectionType(type.id)">
              <input type="checkbox" [checked]="sectionTypes().has(type.id)" class="cursor-pointer" (click)="$event.stopPropagation(); toggleSectionType(type.id)" />
              <app-map-icon [name]="type.icon" />
              <span class="text-sm">{{ type.label }}</span>
            </div>
          }
        </div>
      }
    </div>

    <!-- Quick Filters Dropdown -->
    <div class="relative w-full">
      <button hlmBtn variant="outline" size="sm" (click)="toggleQuickFiltersDropdown($event)"
              class="w-full justify-between h-9 text-sm border-primary/50 text-secondary hover:bg-primary hover:text-secondary dark:border-secondary/50 dark:text-secondary dark:hover:bg-secondary dark:hover:text-secondary-foreground">
        <span class="flex items-center gap-2">
          <app-map-icon [name]="quickFilterIcons[getQuickFilterIcon() || 'grid']" />
          {{ getQuickFilterLabel() }}
        </span>
        <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
             [class.rotate-180]="showQuickFiltersDropdown()">
          <path d="m6 9 6 6 6-6"/>
        </svg>
      </button>
      @if (showQuickFiltersDropdown()) {
        <div class="absolute z-50 mt-1 w-full max-h-96 overflow-auto bg-popover text-popover-foreground border border-primary/20 rounded-md shadow-md p-2" (click)="$event.stopPropagation()">
          @for (tab of getAvailableQuickFilters(); track tab.id) {
            <div class="flex items-center gap-2 p-2 hover:bg-muted rounded cursor-pointer" (click)="selectQuickFilter(tab.id)" [hlmTooltip]="tab.description">
              <input type="radio" name="quickFilter" [checked]="activeTab() === tab.id" class="cursor-pointer" (click)="$event.stopPropagation(); selectQuickFilter(tab.id)" />
              <app-map-icon [name]="quickFilterIcons[tab.icon]" />
              <span class="text-sm">{{ tab.label }}</span>
            </div>
          }
        </div>
      }
    </div>

    <!-- Activity Threshold Input -->
    <app-comparison-operator-input
        [operator]="activityOperator()"
        [value]="lowActivityThreshold()"
        label="Активност"
        [min]="0"
        [max]="100"
        [step]="0.01"
        suffix="%"
        (operatorChange)="activityOperator.set($event)"
        (valueChange)="onThresholdChange($event)" />

    <!-- Combined Risk Dropdown (Type + Categories) -->
    <app-risk-filter-dropdown
      [riskCategories]="riskCategories"
      [riskFilterType]="riskFilterType()"
      [selectedRiskCategories]="selectedRiskCategories()"
      [radioName]="'sectionRiskType'"
      (riskFilterTypeChange)="onRiskFilterTypeChange($event)"
      (selectedRiskCategoriesChange)="onSelectedRiskCategoriesChange($event)"
    />

    <!-- Search Input -->
    <div class="w-full">
      <app-search-filter
        placeholder="Търсене..."
        [value]="searchTerm()"
        (valueChange)="onSearchTermChange($event)" />
    </div>
  </div>
</div>
