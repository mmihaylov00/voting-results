<main class="container mx-auto min-h-svh px-4 py-10 md:py-16">
  <section class="mx-auto max-w-5xl">
    <div class="mb-10 max-w-3xl">
      <p class="mb-3 text-sm font-semibold uppercase tracking-wide text-primary">
        Изборни резултати
      </p>
      <h1 hlmH1 class="text-secondary dark:text-primary">Избори, партии и кандидати</h1>
      <p hlmLead class="mt-4 text-secondary/80 dark:text-foreground/80">
        Разгледайте изборни резултати и профили на партии и президентски кандидати.
      </p>
    </div>

    <div class="grid grid-cols-1 gap-5 sm:grid-cols-2 lg:grid-cols-3">
      @for (option of navigationOptions; track option.route) {
        <article hlmCard class="election-type-card flex min-h-72 flex-col border-primary/20 transition-all">
          <div hlmCardHeader>
            <div class="mb-4 flex h-12 w-12 items-center justify-center rounded-lg bg-primary text-secondary">
              <app-map-icon [name]="option.icon" class="[&_svg]:h-6 [&_svg]:w-6" />
            </div>
            <h2 hlmCardTitle class="text-secondary dark:text-primary">{{ option.title }}</h2>
            <p hlmCardDescription hlmMuted class="text-secondary/70 dark:text-foreground/70">
              {{ option.description }}
            </p>
          </div>

          <div hlmCardContent class="mt-auto">
            <a
              [routerLink]="option.route"
              [attr.aria-label]="option.title"
              hlmBtn
              variant="outline"
              class="w-full border-primary text-secondary hover:bg-primary hover:text-secondary dark:border-secondary dark:text-secondary dark:hover:bg-secondary dark:hover:text-secondary-foreground"
            >
              Разгледай
            </a>
          </div>
        </article>
      }
    </div>
  </section>
</main>
