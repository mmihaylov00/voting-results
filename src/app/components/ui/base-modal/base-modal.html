<div class="fixed inset-0 bg-black/50 backdrop-blur-sm flex items-center justify-center p-4" 
     [class]="zIndex"
     (click)="closeModal()">
    <div class="bg-background border border-primary/20 rounded-lg shadow-xl w-full max-h-[90vh] flex flex-col" 
         [class]="maxWidth"
         (click)="$event.stopPropagation()">
        <!-- Header -->
        @if (title || subtitle || headerActions || showCloseButton) {
            <div class="flex items-center justify-between p-6 border-b border-primary/20">
                <div class="flex-1">
                    @if (title) {
                        <h2 hlmH2 class="m-0 text-secondary dark:text-primary">{{ title }}</h2>
                    }
                    @if (subtitle) {
                        <p hlmMuted class="text-sm mt-1">{{ subtitle }}</p>
                    }
                    @if (headerActions) {
                        <ng-container [ngTemplateOutlet]="headerActions"></ng-container>
                    }
                </div>
                @if (showCloseButton) {
                    <button hlmBtn variant="ghost" size="icon" (click)="closeModal()" 
                            class="text-secondary dark:text-primary hover:bg-primary dark:hover:bg-primary dark:hover:text-primary-foreground">
                        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <line x1="18" y1="6" x2="6" y2="18"/>
                            <line x1="6" y1="6" x2="18" y2="18"/>
                        </svg>
                    </button>
                }
            </div>
        }

        <!-- Content -->
        <div class="flex-1 overflow-auto p-6">
            <ng-content></ng-content>
        </div>

        <!-- Footer -->
        @if (footer) {
            <div class="flex justify-end gap-2 p-6 border-t border-primary/20">
                <ng-container [ngTemplateOutlet]="footer"></ng-container>
            </div>
        }
    </div>
</div>
