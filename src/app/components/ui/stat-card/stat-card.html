<div hlmCard class="border-primary/20 bg-primary/5 h-full flex flex-col">
  <div hlmCardHeader class="p-4 pb-0 flex-shrink-0">
    <p hlmCardDescription class="text-xs uppercase tracking-wider">{{ label }}</p>
  </div>
  <div hlmCardContent class="p-4 pt-1 flex-1">
    @if (customContent) {
      <ng-container [ngTemplateOutlet]="customContent"></ng-container>
    } @else {
      <p hlmH4 
         class="m-0 text-secondary dark:text-primary"
         [hlmTooltip]="tooltipData"
         [currentValue]="currentValue"
         [isPercent]="isPercent">
        {{ displayValue }}
      </p>
    }
  </div>
</div>
