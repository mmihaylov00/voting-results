<div class="container mx-auto py-12 px-4">
  <div class="text-center mb-12">
    <h1 hlmH1 class="text-secondary dark:text-primary">Изборни резултати</h1>
    <p hlmLead class="mt-4 text-secondary/80 dark:text-foreground/80">Изберете дата на избори, за да прегледате детайлна статистика</p>
    <div class="mt-6">
      <a routerLink="/trends" hlmBtn variant="outline" class="border-primary text-secondary hover:bg-primary/20 dark:border-secondary dark:text-secondary">
        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="mr-2"><path d="M3 3v18h18"/><path d="m19 9-5 5-4-4-3 3"/></svg>
        Исторически трендове
      </a>
    </div>
  </div>

  <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8 justify-items-center">
    @for (date of dates; track date.date) {
      <div hlmCard class="w-full max-w-sm transition-all hover:shadow-xl border-primary/20 hover:border-primary/50">
        <div hlmCardHeader class="text-center">
          <div class="flex justify-center mb-4">
            <div class="p-3 bg-primary/20 dark:bg-primary/10 rounded-full">
              <svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="text-secondary dark:text-primary"><rect width="18" height="18" x="3" y="4" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
            </div>
          </div>
          <h3 hlmCardTitle class="text-secondary dark:text-primary">{{ date.name }}</h3>
        </div>
        <div hlmCardContent class="text-center">
          <a [routerLink]="['/election', date.date]" hlmBtn variant="outline" class="w-full border-primary text-secondary hover:bg-primary/20 hover:text-secondary dark:border-secondary dark:text-secondary dark:hover:bg-secondary dark:hover:text-secondary-foreground">
            Избери район
          </a>
        </div>
      </div>
    }
  </div>
</div>
