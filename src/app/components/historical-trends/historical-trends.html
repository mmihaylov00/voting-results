<div class="container mx-auto px-4 py-8">
  <div class="flex flex-col md:flex-row justify-between items-start md:items-center gap-4 mb-8">
    <div>
      <h1 hlmH2 class="border-b-0 pb-0 text-secondary dark:text-primary">Исторически трендове</h1>
      <p hlmLead class="text-secondary/80 dark:text-foreground/80">Проследете представянето на ПП-ДБ във времето</p>
    </div>
    <div class="flex gap-2">
      <a routerLink="/" hlmBtn variant="default">
        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="mr-2"><path d="m12 19-7-7 7-7"/><path d="M19 12H5"/></svg>
        Назад към изборите
      </a>
    </div>
  </div>

  <div hlmCard class="mb-8 p-4 md:p-6 border-primary/20">
    <div class="flex flex-col md:flex-row gap-4 items-end">
      <div class="w-full md:w-auto">
        <label class="text-xs font-semibold text-muted-foreground uppercase mb-1 block">Ниво на анализ</label>
        <div class="flex gap-2">
          <button hlmBtn [variant]="level() === 'national' ? 'default' : 'outline'" size="sm" (click)="level.set('national')">Национално</button>
          <button hlmBtn [variant]="level() === 'region' ? 'default' : 'outline'" size="sm" (click)="level.set('region')">Район</button>
          <button hlmBtn [variant]="level() === 'section' ? 'default' : 'outline'" size="sm" (click)="level.set('section')">Секция</button>
        </div>
      </div>

      @if (level() === 'region' || level() === 'section') {
        <div class="w-full md:w-64">
          <label class="text-xs font-semibold text-muted-foreground uppercase mb-1 block">Избери район</label>
          <select [ngModel]="selectedRegionId()" (ngModelChange)="selectedRegionId.set($event)" class="w-full h-9 rounded-md border border-input bg-background px-3 py-1 text-sm shadow-sm transition-colors focus-visible:outline-none focus-visible:ring-1 focus-visible:ring-ring">
            <option value="">-- Избери район --</option>
            @for (region of regions; track region.id) {
              <option [value]="region.id">{{ region.name }} ({{ region.id }})</option>
            }
          </select>
        </div>
      }

      @if (level() === 'section') {
        <div class="w-full md:w-64">
          <label class="text-xs font-semibold text-muted-foreground uppercase mb-1 block">ID на секция</label>
          <input hlmInput placeholder="напр. 010100001" [ngModel]="selectedSectionId()" (ngModelChange)="selectedSectionId.set($event)" class="w-full" />
        </div>
      }
    </div>
  </div>

  <div class="grid grid-cols-1 lg:grid-cols-2 gap-8">
    <div hlmCard class="border-primary/20 p-4">
      @if (chartOptions.series) {
        <highcharts-chart [options]="chartOptions" style="width: 100%; height: 400px; display: block;"></highcharts-chart>
      }
    </div>
    <div hlmCard class="border-primary/20 p-4">
      @if (percentChartOptions.series) {
        <highcharts-chart [options]="percentChartOptions" style="width: 100%; height: 400px; display: block;"></highcharts-chart>
      }
    </div>
  </div>
</div>
