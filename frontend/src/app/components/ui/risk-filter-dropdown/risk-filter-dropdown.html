<div class="relative w-full">
  <button hlmBtn variant="outline" size="sm" (click)="toggleDropdown($event)"
          class="w-full justify-between h-9 text-sm border-destructive/50 text-destructive hover:bg-destructive/90 hover:text-destructive-foreground">
    <span>{{ getRiskLabel() }}</span>
    <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
         [class.rotate-180]="showDropdown()">
      <path d="m6 9 6 6 6-6"/>
    </svg>
  </button>
  @if (showDropdown()) {
    <div class="absolute z-50 mt-1 w-full overflow-auto bg-popover text-popover-foreground border border-destructive/20 rounded-md shadow-md p-2" (click)="$event.stopPropagation()">
      <div class="flex items-center gap-2 p-2 hover:bg-muted rounded cursor-pointer" (click)="clearRiskFilter()">
        <input type="radio" [name]="radioName" [checked]="riskFilterType === null && selectedRiskCategories.size === 0" class="cursor-pointer" (click)="$event.stopPropagation(); clearRiskFilter()" />
        <span class="text-sm">Всички</span>
      </div>
      <div class="flex items-center gap-2 p-2 hover:bg-muted rounded cursor-pointer" (click)="toggleRiskFilterType('any')">
        <input type="radio" [name]="radioName" [checked]="riskFilterType === 'any'" class="cursor-pointer" (click)="$event.stopPropagation(); toggleRiskFilterType('any')" />
        <span class="text-sm">Рискови</span>
      </div>
      <div class="flex items-center gap-2 p-2 hover:bg-muted rounded cursor-pointer" (click)="toggleRiskFilterType('none')">
        <input type="radio" [name]="radioName" [checked]="riskFilterType === 'none'" class="cursor-pointer" (click)="$event.stopPropagation(); toggleRiskFilterType('none')" />
        <span class="text-sm">Безрискови</span>
      </div>
      <div class="border-t border-border my-2"></div>
      <div class="text-xs font-semibold text-muted-foreground uppercase mb-2 px-2">Рискови категории</div>
      @for (category of riskCategories; track category.code) {
        <div class="flex items-center gap-2 p-2 hover:bg-muted rounded cursor-pointer" (click)="toggleRiskCategory(category.code)">
          <input type="checkbox" [checked]="selectedRiskCategories.has(category.code)" class="cursor-pointer" (click)="$event.stopPropagation(); toggleRiskCategory(category.code)" />
          <span class="text-sm">{{ category.label }}</span>
        </div>
      }
    </div>
  }
</div>
