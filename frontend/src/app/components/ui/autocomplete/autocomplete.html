<div data-autocomplete-root class="relative">
  <div class="relative">
    <input
      hlmInput
      [name]="inputName"
      [placeholder]="placeholder"
      [required]="required"
      [ngModel]="inputValue"
      (ngModelChange)="onInputChange($event)"
      (click)="onInputClick($event)"
      autocomplete="off"
      class="pr-9"
    />
    @if (inputValue) {
      <button
        type="button"
        hlmBtn
        variant="ghost"
        size="icon"
        class="absolute right-1 top-1 h-7 w-7"
        (click)="clear($event)"
      >
        <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none"
             stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <line x1="18" y1="6" x2="6" y2="18"></line>
          <line x1="6" y1="6" x2="18" y2="18"></line>
        </svg>
      </button>
    }
  </div>

  @if (open()) {
    <div class="absolute z-[220] mt-1 max-h-56 w-full overflow-auto rounded-md border border-border bg-popover p-1 shadow-md">
      @for (option of filteredOptions; track option.id) {
        <button
          type="button"
          class="w-full rounded-sm px-2 py-2 text-left text-sm hover:bg-muted"
          (click)="selectOption(option)"
        >
          <div class="truncate">{{ option.label }}</div>
          @if (option.description) {
            <div class="truncate text-xs text-muted-foreground">{{ option.description }}</div>
          }
        </button>
      }
      @if (filteredOptions.length === 0) {
        <div class="px-2 py-2 text-sm text-muted-foreground">Няма резултати</div>
      }
    </div>
  }
</div>
