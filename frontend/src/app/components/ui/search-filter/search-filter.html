<div class="relative w-full" [ngClass]="containerClass">
  <svg
    xmlns="http://www.w3.org/2000/svg"
    width="20"
    height="20"
    viewBox="0 0 24 24"
    fill="none"
    stroke="currentColor"
    stroke-width="2"
    stroke-linecap="round"
    stroke-linejoin="round"
    class="absolute left-3 top-1/2 -translate-y-1/2 text-primary dark:text-secondary/50"
    [ngClass]="iconClass">
    <circle cx="11" cy="11" r="8"/>
    <path d="m21 21-4.3-4.3"/>
  </svg>
  <input
    hlmInput
    [id]="inputId"
    [placeholder]="placeholder"
    [value]="value"
    (input)="onInput($any($event.target).value)"
    class="pl-10 border-primary/50 focus:border-primary dark:border-secondary/50 dark:focus:border-secondary w-full h-9"
    [ngClass]="inputClass" />
</div>
