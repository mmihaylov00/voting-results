<div class="p-6">
  <div hlmCard class="mx-auto max-w-[900px]">
    <div hlmCardHeader>
      <div class="flex items-center justify-between gap-4">
        <h2 hlmCardTitle>Потребители</h2>
        <button hlmBtn type="button" (click)="openCreateModal()">Нов потребител</button>
      </div>
    </div>
    <div hlmCardContent>
      @if (error()) {
        <p class="text-destructive">{{ error() }}</p>
      }

      <div class="mb-4 grid items-end gap-4 md:grid-cols-[minmax(260px,1fr)_minmax(180px,240px)]">
        <app-search-filter
          [value]="searchName()"
          [placeholder]="'Търси по име или имейл...'"
          (valueChange)="onSearchChange($event)"
        />
        <label class="flex flex-col gap-1.5">
          <span class="text-xs">Роля</span>
          <select hlmInput [ngModel]="filterRole()" (ngModelChange)="onRoleFilterChange($event)">
            <option value="all">Всички</option>
            @for (role of roleOptions; track role) {
              <option [value]="role">{{ roleName(role) }}</option>
            }
          </select>
        </label>
      </div>

      <div class="overflow-x-auto">
        <table hlmTable>
          <thead hlmTableHeader>
          <tr hlmTableRow>
            <th
              hlmTableHead
              app-sortable-table-header
              columnKey="email"
              label="Имейл"
              [currentSortColumn]="sortColumn()"
              [sortDirection]="sortDirection()"
              (sortChange)="onSort($event)"
            ></th>
            <th
              hlmTableHead
              app-sortable-table-header
              columnKey="name"
              label="Име"
              [currentSortColumn]="sortColumn()"
              [sortDirection]="sortDirection()"
              (sortChange)="onSort($event)"
            ></th>
            <th
              hlmTableHead
              app-sortable-table-header
              columnKey="role"
              label="Роля"
              [currentSortColumn]="sortColumn()"
              [sortDirection]="sortDirection()"
              (sortChange)="onSort($event)"
            ></th>
            <th hlmTableHead class="text-right">Действия</th>
          </tr>
          </thead>
          <tbody hlmTableBody>
            @for (user of paginatedUsers(); track user.id) {
              <tr hlmTableRow>
                <td hlmTableCell>{{ user.email }}</td>
                <td hlmTableCell>{{ user.name || '-' }}</td>
                <td hlmTableCell>{{ roleLabel(user) }}</td>
                <td hlmTableCell class="text-right">
                  <button hlmBtn
                          class="border-destructive text-destructive hover:bg-destructive hover:text-destructive-foreground"
                          variant="outline" size="sm" (click)="remove(user.id)">Изтрий
                  </button>
                </td>
              </tr>
            }
          </tbody>
        </table>
      </div>

      <div class="mt-4 flex flex-wrap items-center justify-between gap-3">
        <div class="text-sm opacity-85">{{ resultRangeLabel() }}</div>
        <hlm-numbered-pagination
          [(currentPage)]="currentPage"
          [(itemsPerPage)]="pageSize"
          [totalItems]="filteredAndSortedUsers().length"
          [pageSizes]="pageSizeOptions"
          [maxSize]="7"
        />
      </div>
    </div>
  </div>

  @if (createModalOpen()) {
    <app-base-modal size="half" title="Нов потребител" subtitle="Създай потребител с достъп до системата."
                    (close)="closeCreateModal()">
      <form (ngSubmit)="create()" class="grid grid-cols-12 gap-4">
        <label class="flex flex-col col-span-6 gap-1.5">
          <span>Имейл</span>
          <input hlmInput type="email" name="email" [(ngModel)]="form.email" required/>
        </label>
        <label class="flex flex-col col-span-6 gap-1.5">
          <span>Парола</span>
          <input hlmInput type="password" name="password" [(ngModel)]="form.password" required/>
        </label>
        <label class="flex flex-col col-span-6 gap-1.5">
          <span>Име</span>
          <input hlmInput type="text" name="name" [(ngModel)]="form.name"/>
        </label>
        <label class="flex flex-col col-span-6 gap-1.5">
          <span>Роля</span>
          <select hlmInput name="role" [(ngModel)]="form.role">
            @for (role of roleOptions; track role) {
              <option [value]="role">{{ roleName(role) }}</option>
            }
          </select>
        </label>

        @if (createError()) {
          <p class="text-destructive col-span-12">{{ createError() }}</p>
        }

        <div class="flex justify-end col-span-12 gap-3">
          <button hlmBtn type="button" variant="outline" (click)="closeCreateModal()">Отказ</button>
          <button hlmBtn type="submit" [disabled]="loading() || !canSubmitCreate()">Създай</button>
        </div>
      </form>
    </app-base-modal>
  }
</div>
