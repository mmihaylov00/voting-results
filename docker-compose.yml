version: "3.9"

services:
  db:
    image: postgres:16
    container_name: votes-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-votes}
    ports:
      - "5432:5432"
    volumes:
      - votes_db:/var/lib/postgresql/data

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: votes-backend
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://postgres:postgres@db:5432/votes}
      JWT_SECRET: ${JWT_SECRET:-change_me}
      PORT: ${BACKEND_PORT:-3000}
    ports:
      - "3000:3000"
    depends_on:
      - db

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: votes-frontend
    ports:
      - "8080:80"
    depends_on:
      - backend

volumes:
  votes_db:
    name: votes_db
